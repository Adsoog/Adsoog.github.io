<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Fondo oscuro profundo alineado a la paleta del portafolio -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24" />
      <stop offset="100%" stop-color="#0d0e13" />
    </linearGradient>

    <!-- Gradiente de acento insignia: Morado a Verde Esmeralda -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Gradiente blanco brillante para el cuerpo principal -->
    <linearGradient id="white-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Resplandor sutil ambiental -->
    <radialGradient id="glow-grad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Contenedor squircle con borde refinado -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg-grad)" stroke="#2b3145" stroke-width="2.5" />

  <!-- Aura de resplandor sutil -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#glow-grad)" />

  <!-- Monograma geométrico Adso Martín (A + M):
       - Silueta externa: Letra 'A' geométrica y sólida (Adso)
       - Chevron interior y barra: Letra 'M' estilizada en gradiente (Martín)
  -->
  <!-- Cuerpo externo de la letra 'A' -->
  <path
    d="M 64 20
       L 102 100
       L 84 100
       L 74 77
       L 54 77
       L 44 100
       L 26 100
       Z
       M 64 42
       L 71 61
       L 57 61
       Z"
    fill="url(#white-grad)"
  />

  <!-- Chevron 'M' dinámico en gradiente morado a esmeralda conectando el centro -->
  <path
    d="M 44 74
       L 64 90
       L 84 74
       L 78 68
       L 64 79
       L 50 68
       Z"
    fill="url(#accent-grad)"
  />

  <!-- Punto de estado de ingeniería (Esmeralda vivo) -->
  <circle cx="96" cy="30" r="4.5" fill="#10b981" />
  <circle cx="96" cy="30" r="6.5" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4" fill="none" />
</svg>