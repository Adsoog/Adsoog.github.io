<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091412" />
      <stop offset="50%" stop-color="#0f211c" />
      <stop offset="100%" stop-color="#060c0b" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow-2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="420" rx="16" fill="url(#bg-grad-2)" />
  <rect width="800" height="420" rx="16" stroke="#16382f" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Ambient Glow -->
  <circle cx="680" cy="100" r="150" fill="#10b981" fill-opacity="0.12" filter="url(#glow-2)" />
  <circle cx="150" cy="320" r="140" fill="#06b6d4" fill-opacity="0.1" filter="url(#glow-2)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 70 H800 M0 140 H800 M0 210 H800 M0 280 H800 M0 350 H800" />
    <path d="M100 0 V420 M200 0 V420 M300 0 V420 M400 0 V420 M500 0 V420 M600 0 V420 M700 0 V420" />
  </g>

  <!-- Messaging App UI Container -->
  <g transform="translate(60, 45)">
    <rect width="680" height="330" rx="12" fill="#0e1715" stroke="#1a3830" stroke-width="1.5" />
    
    <!-- Top Header Bar -->
    <rect width="680" height="42" rx="12" fill="#142420" />
    <rect y="30" width="680" height="12" fill="#142420" />
    
    <circle cx="28" cy="21" r="7" fill="#10b981" />
    <text x="44" y="25" fill="#f1f5f9" font-family="sans-serif" font-weight="600" font-size="13">The Wasppers // Real-Time Automation Suite</text>

    <rect x="520" y="10" width="145" height="22" rx="6" fill="#091412" stroke="#10b981" stroke-width="1" />
    <circle cx="534" cy="21" r="3.5" fill="#10b981" />
    <text x="544" y="25" fill="#34d399" font-family="monospace" font-weight="600" font-size="10">WS: 10K MSGS/SEC</text>

    <!-- App Body: Left Sidebar Chats + Right Chat & Bot Stream -->
    <!-- Left Chat List -->
    <rect x="18" y="55" width="210" height="260" rx="8" fill="#091210" stroke="#142b25" />
    
    <!-- Active Channels -->
    <g transform="translate(28, 70)">
      <rect width="190" height="48" rx="6" fill="#132621" stroke="#10b981" stroke-opacity="0.4" />
      <circle cx="20" cy="24" r="10" fill="#10b981" fill-opacity="0.2" />
      <text x="16" y="28" fill="#10b981" font-family="monospace" font-weight="bold" font-size="11">⚡</text>
      <text x="38" y="20" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="600">Enterprise Bot Hub</text>
      <text x="38" y="36" fill="#34d399" font-family="monospace" font-size="9">Active Flow #4409</text>
    </g>

    <g transform="translate(28, 128)">
      <rect width="190" height="48" rx="6" fill="#0c1714" stroke="#162e27" />
      <circle cx="20" cy="24" r="10" fill="#3b82f6" fill-opacity="0.2" />
      <text x="16" y="28" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="11">🤖</text>
      <text x="38" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="500">Auto Dispatcher</text>
      <text x="38" y="36" fill="#64748b" font-family="monospace" font-size="9">Broadcast Queue OK</text>
    </g>

    <g transform="translate(28, 186)">
      <rect width="190" height="48" rx="6" fill="#0c1714" stroke="#162e27" />
      <circle cx="20" cy="24" r="10" fill="#8b5cf6" fill-opacity="0.2" />
      <text x="16" y="28" fill="#a78bfa" font-family="monospace" font-weight="bold" font-size="11">📊</text>
      <text x="38" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="500">Metrics Ingestion</text>
      <text x="38" y="36" fill="#64748b" font-family="monospace" font-size="9">WebSockets Live</text>
    </g>

    <!-- Right Live Conversation & Bot Orchestrator -->
    <rect x="240" y="55" width="422" height="260" rx="8" fill="#091210" stroke="#142b25" />
    
    <!-- Message 1 (Incoming Request) -->
    <g transform="translate(255, 70)">
      <rect width="280" height="42" rx="8" fill="#13221e" stroke="#1a3830" />
      <text x="14" y="20" fill="#94a3b8" font-family="monospace" font-size="10">USER DISPATCH [ORDER #8849]</text>
      <text x="14" y="34" fill="#e2e8f0" font-family="sans-serif" font-size="11">Procesar confirmación y enviar factura PDF</text>
    </g>

    <!-- Message 2 (Bot AI Automated Action) -->
    <g transform="translate(345, 125)">
      <rect width="300" height="70" rx="8" fill="#123028" stroke="#10b981" stroke-opacity="0.6" />
      <circle cx="16" cy="18" r="4" fill="#34d399" />
      <text x="26" y="21" fill="#34d399" font-family="monospace" font-size="10" font-weight="600">BOT DESATENDIDO · GEMINI PARSER</text>
      <text x="14" y="42" fill="#f1f5f9" font-family="sans-serif" font-size="11">Factura generada y validada en 42ms.</text>
      <text x="14" y="58" fill="#94a3b8" font-family="monospace" font-size="10">Respuesta automatizada enviada vía WebSocket</text>
    </g>

    <!-- Interactive Bot Command Line / Trigger Pill -->
    <g transform="translate(255, 215)">
      <rect width="390" height="45" rx="8" fill="#0b1a16" stroke="#10b981" stroke-width="1" />
      <text x="15" y="27" fill="#64748b" font-family="monospace" font-size="11">/trigger-ai-workflow --async --low-cost --realtime</text>
      <rect x="305" y="9" width="75" height="26" rx="5" fill="#10b981" />
      <text x="322" y="25" fill="#042f2e" font-family="monospace" font-weight="bold" font-size="10">EXEC</text>
    </g>

    <g transform="translate(255, 275)">
      <circle cx="8" cy="8" r="4" fill="#10b981" />
      <text x="20" y="12" fill="#6ee7b7" font-family="monospace" font-size="10">Microservicio Golang &amp; Python en servidor Linux VPS</text>
    </g>
  </g>
</svg>
