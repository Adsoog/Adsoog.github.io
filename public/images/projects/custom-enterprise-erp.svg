      <rect width="640" height="160" rx="8" fill="#0d0a17" stroke="#241b42" />
      
      <!-- Table Header -->
      <rect width="640" height="32" rx="8" fill="#17122b" />
      <text x="20" y="20" fill="#a78bfa" font-family="monospace" font-weight="600" font-size="11">DOC / FOLIO</text>
      <text x="150" y="20" fill="#a78bfa" font-family="monospace" font-weight="600" font-size="11">CLIENTE / EMPRESA</text>
      <text x="340" y="20" fill="#a78bfa" font-family="monospace" font-weight="600" font-size="11">GEO / UBICACIÓN</text>
      <text x="490" y="20" fill="#a78bfa" font-family="monospace" font-weight="600" font-size="11">ESTADO RBAC</text>

      <!-- Row 1 -->
      <text x="20" y="60" fill="#f1f5f9" font-family="monospace" font-size="11">FAC-2026-098</text>
      <text x="150" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="11">Corporativo Industrial SA</text>
      <text x="340" y="60" fill="#38bdf8" font-family="monospace" font-size="11">Maps: -12.046, -77.042</text>
      <rect x="490" y="47" width="90" height="18" rx="4" fill="#10b981" fill-opacity="0.2" />
      <text x="502" y="60" fill="#34d399" font-family="monospace" font-weight="600" font-size="10">APROBADO</text>

      <!-- Row 2 -->
      <text x="20" y="95" fill="#f1f5f9" font-family="monospace" font-size="11">FAC-2026-099</text>
      <text x="150" y="95" fill="#cbd5e1" font-family="sans-serif" font-size="11">Distribuidora Global SAC</text>
      <text x="340" y="95" fill="#38bdf8" font-family="monospace" font-size="11">Maps: -12.112, -77.028</text>
      <rect x="490" y="82" width="90" height="18" rx="4" fill="#3b82f6" fill-opacity="0.2" />
      <text x="502" y="95" fill="#60a5fa" font-family="monospace" font-weight="600" font-size="10">DESPACHO</text>

      <!-- Row 3 -->
      <text x="20" y="130" fill="#f1f5f9" font-family="monospace" font-size="11">FAC-2026-100</text>
      <text x="150" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="11">Servicios &amp; Logística SAC</text>
      <text x="340" y="130" fill="#38bdf8" font-family="monospace" font-size="11">Maps: -12.088, -77.012</text>
      <rect x="490" y="117" width="90" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2" />
      <text x="508" y="130" fill="#fbbf24" font-family="monospace" font-weight="600" font-size="10">AUDITORÍA</text>
    </g>
