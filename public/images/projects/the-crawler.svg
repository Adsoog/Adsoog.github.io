<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1117" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2433" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#121620" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow-1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="420" rx="16" fill="url(#bg-grad-1)" />
  <rect width="800" height="420" rx="16" stroke="#2a324b" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Ambient Glow Orbs -->
  <circle cx="620" cy="120" r="140" fill="#06b6d4" fill-opacity="0.12" filter="url(#glow-1)" />
  <circle cx="200" cy="300" r="160" fill="#3b82f6" fill-opacity="0.1" filter="url(#glow-1)" />

  <!-- Grid pattern overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 70 H800 M0 140 H800 M0 210 H800 M0 280 H800 M0 350 H800" />
    <path d="M100 0 V420 M200 0 V420 M300 0 V420 M400 0 V420 M500 0 V420 M600 0 V420 M700 0 V420" />
  </g>

  <!-- Browser Window Mockup -->
  <g transform="translate(60, 45)">
    <!-- Window Frame -->
    <rect width="680" height="330" rx="12" fill="url(#card-grad)" stroke="#333f5c" stroke-width="1.5" />
    
    <!-- Top Window Bar -->
    <rect width="680" height="38" rx="12" fill="#181d2a" />
    <rect y="26" width="680" height="12" fill="#181d2a" />
    <circle cx="24" cy="19" r="5" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="40" cy="19" r="5" fill="#f59e0b" fill-opacity="0.8" />
    <circle cx="56" cy="19" r="5" fill="#10b981" fill-opacity="0.8" />

    <!-- URL Bar with Extension Icon -->
    <rect x="80" y="8" width="460" height="22" rx="6" fill="#0d111a" stroke="#252d40" />
    <text x="96" y="23" fill="#64748b" font-family="monospace" font-size="11">https://app.crawler-ai.internal/automation/pipeline</text>

    <!-- Chrome MV3 Extension Badge -->
    <rect x="560" y="8" width="105" height="22" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
    <circle cx="574" cy="19" r="3.5" fill="#06b6d4" />
    <text x="584" y="23" fill="#38bdf8" font-family="monospace" font-weight="600" font-size="10">EXT MV3: ACTIVE</text>

    <!-- Content Area: 2 Columns (DOM Automation Engine & Extraction Feed) -->
    <!-- Left Column: Code / Action Graph -->
    <rect x="25" y="55" width="310" height="250" rx="8" fill="#0c1017" stroke="#1e2638" />
    
    <!-- Code Editor lines -->
    <text x="40" y="85" fill="#38bdf8" font-family="monospace" font-size="11">const <tspan fill="#f1f5f9">crawler</tspan> = new <tspan fill="#818cf8">PlaywrightEngine</tspan>();</text>
    <text x="40" y="108" fill="#64748b" font-family="monospace" font-size="11">// Unattended headless session</text>
    <text x="40" y="131" fill="#f1f5f9" font-family="monospace" font-size="11">await <tspan fill="#34d399">crawler.bypassFrictions</tspan>();</text>
    <text x="40" y="154" fill="#f1f5f9" font-family="monospace" font-size="11">const <tspan fill="#f59e0b">data</tspan> = await <tspan fill="#818cf8">geminiAI.extract</tspan>({</text>
    <text x="55" y="177" fill="#94a3b8" font-family="monospace" font-size="11">schema: <tspan fill="#38bdf8">StructuredJSON</tspan>,</text>
    <text x="55" y="200" fill="#94a3b8" font-family="monospace" font-size="11">lowCostOptimization: <tspan fill="#10b981">true</tspan></text>
    <text x="40" y="223" fill="#f1f5f9" font-family="monospace" font-size="11">});</text>

    <!-- Node Status Pill -->
    <rect x="40" y="250" width="280" height="36" rx="6" fill="#141c2b" stroke="#06b6d4" stroke-opacity="0.3" />
    <circle cx="58" cy="268" r="4" fill="#34d399" />
    <text x="72" y="272" fill="#94a3b8" font-family="monospace" font-size="11">Status: <tspan fill="#34d399" font-weight="600">2,450 Records Streamed / 0 Latency</tspan></text>

    <!-- Right Column: Visual Data Inspector -->
    <rect x="350" y="55" width="305" height="250" rx="8" fill="#0c1017" stroke="#1e2638" />
    
    <!-- Header of inspector -->
    <rect x="365" y="70" width="275" height="28" rx="5" fill="#141c2b" />
    <text x="380" y="88" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">AI SCHEMA EXTRACTION PREVIEW</text>

    <!-- Extraction item rows -->
    <g transform="translate(365, 110)">
      <rect width="275" height="42" rx="6" fill="#131926" stroke="#253046" />
      <circle cx="20" cy="21" r="5" fill="#3b82f6" />
      <text x="36" y="19" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="500">Document Parser API</text>
      <text x="36" y="33" fill="#64748b" font-family="monospace" font-size="9">JSON · Schema Matched 100%</text>
      <text x="220" y="25" fill="#10b981" font-family="monospace" font-size="11" font-weight="600">PARSED</text>
    </g>

    <g transform="translate(365, 160)">
      <rect width="275" height="42" rx="6" fill="#131926" stroke="#253046" />
      <circle cx="20" cy="21" r="5" fill="#06b6d4" />
      <text x="36" y="19" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="500">DOM Action Execution</text>
      <text x="36" y="33" fill="#64748b" font-family="monospace" font-size="9">Playwright · Headless Pipeline</text>
      <text x="220" y="25" fill="#06b6d4" font-family="monospace" font-size="11" font-weight="600">SYNCED</text>
    </g>

    <g transform="translate(365, 210)">
      <rect width="275" height="42" rx="6" fill="#131926" stroke="#253046" />
      <circle cx="20" cy="21" r="5" fill="#8b5cf6" />
      <text x="36" y="19" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="500">Chrome Storage Sync</text>
      <text x="36" y="33" fill="#64748b" font-family="monospace" font-size="9">Manifest V3 · Local & Cloud DB</text>
      <text x="220" y="25" fill="#8b5cf6" font-family="monospace" font-size="11" font-weight="600">READY</text>
    </g>
  </g>
</svg>
