<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1219" />
      <stop offset="50%" stop-color="#121f2b" />
      <stop offset="100%" stop-color="#070c12" />
    </linearGradient>
    <linearGradient id="teal-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow-5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="420" rx="16" fill="url(#bg-grad-5)" />
  <rect width="800" height="420" rx="16" stroke="#25435b" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Ambient Glow -->
  <circle cx="680" cy="120" r="160" fill="#14b8a6" fill-opacity="0.12" filter="url(#glow-5)" />
  <circle cx="160" cy="300" r="140" fill="#6366f1" fill-opacity="0.08" filter="url(#glow-5)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 70 H800 M0 140 H800 M0 210 H800 M0 280 H800 M0 350 H800" />
    <path d="M100 0 V420 M200 0 V420 M300 0 V420 M400 0 V420 M500 0 V420 M600 0 V420 M700 0 V420" />
  </g>

  <!-- Godot Viewport & Simulation Showcase Container -->
  <g transform="translate(60, 45)">
    <rect width="680" height="330" rx="12" fill="#0d1822" stroke="#213a52" stroke-width="1.5" />
    
    <!-- Top Header -->
    <rect width="680" height="42" rx="12" fill="#142636" />
    <rect y="30" width="680" height="12" fill="#142636" />
    
    <circle cx="28" cy="21" r="7" fill="#14b8a6" />
    <text x="44" y="25" fill="#f1f5f9" font-family="sans-serif" font-weight="600" font-size="13">Godot Engine // 2D/3D Physics &amp; Vector Mathematics</text>

    <rect x="490" y="10" width="175" height="22" rx="6" fill="#0b1620" stroke="#14b8a6" stroke-width="1" />
    <circle cx="504" cy="21" r="3.5" fill="#2dd4bf" />
    <text x="514" y="25" fill="#2dd4bf" font-family="monospace" font-weight="600" font-size="10">60 FPS · REALTIME</text>

    <!-- Simulation Canvas -->
    <g transform="translate(20, 55)">
      <rect width="640" height="255" rx="8" fill="#070e14" stroke="#1c3349" />
      
      <!-- Coordinate System axes -->
      <line x1="40" y1="210" x2="600" y2="210" stroke="#2a4763" stroke-width="1.5" />
      <line x1="320" y1="30" x2="320" y2="230" stroke="#2a4763" stroke-width="1.5" />
      
      <!-- Vector trajectory curve -->
      <path d="M 80 200 Q 200 40, 340 120 T 560 70" stroke="#2dd4bf" stroke-width="2.5" fill="none" stroke-dasharray="6 4" />
      
      <!-- Physics rigidbodies -->
      <circle cx="120" cy="180" r="14" fill="#0ea5e9" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="240" cy="80" r="22" fill="#14b8a6" fill-opacity="0.3" stroke="#2dd4bf" stroke-width="2" />
      <circle cx="340" cy="120" r="16" fill="#8b5cf6" fill-opacity="0.3" stroke="#a78bfa" stroke-width="1.5" />
      <circle cx="480" cy="90" r="18" fill="#f43f5e" fill-opacity="0.3" stroke="#fb7185" stroke-width="1.5" />

      <!-- Force vectors arrows -->
      <line x1="240" y1="80" x2="290" y2="50" stroke="#fbbf24" stroke-width="2" />
      <polygon points="295,47 285,48 290,56" fill="#fbbf24" />
      <text x="298" y="48" fill="#fbbf24" font-family="monospace" font-size="10">F = m · a</text>

      <!-- Math algorithm metrics pill -->
      <g transform="translate(430, 160)">
        <rect width="190" height="75" rx="6" fill="#112233" stroke="#203a54" />
        <text x="12" y="22" fill="#94a3b8" font-family="monospace" font-size="10">ALGORITHMS APPLIED:</text>
        <text x="12" y="40" fill="#2dd4bf" font-family="monospace" font-size="10">· Linear Algebra &amp; Quaternions</text>
        <text x="12" y="56" fill="#38bdf8" font-family="monospace" font-size="10">· Collision Detection (GJK)</text>
        <text x="12" y="70" fill="#a78bfa" font-family="monospace" font-size="10">· Custom GLSL Shaders</text>
      </g>
    </g>
  </g>
</svg>
