<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ks" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-ks)" />
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <path d="M 0,90 H 800 M 0,180 H 800 M 0,270 H 800 M 0,360 H 800" />
    <path d="M 160,0 V 450 M 320,0 V 450 M 480,0 V 450 M 640,0 V 450" />
  </g>
  <!-- 360 rotating circle camera platform -->
  <g transform="translate(400, 210)">
    <ellipse cx="0" cy="50" rx="140" ry="35" fill="none" stroke="#fbcfe8" stroke-width="4" stroke-dasharray="10 8" />
    <!-- Rotating arrow -->
    <path d="M 130,50 A 130 32 0 0 0 -130,50" fill="none" stroke="#ffffff" stroke-width="4" />
    <polygon points="-135,40 -125,55 -145,55" fill="#ffffff" />
    <!-- Phone / Mobile Device in center -->
    <rect x="-35" y="-80" width="70" height="120" rx="14" fill="#18181b" stroke="#f472b6" stroke-width="3" />
    <rect x="-26" y="-68" width="52" height="96" rx="6" fill="#fdf2f8" opacity="0.2" />
    <!-- Play icon on phone -->
    <polygon points="-6,-20 10,-10 -6,0" fill="#f472b6" />
  </g>
  <text x="400" y="415" fill="#fdf2f8" font-family="monospace" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="2">KARLA SMILE · FLUTTER & DJANGO 360° VIDEO</text>
</svg>