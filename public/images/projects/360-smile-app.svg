<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f0c" />
      <stop offset="50%" stop-color="#241610" />
      <stop offset="100%" stop-color="#0d0806" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow-4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="420" rx="16" fill="url(#bg-grad-4)" />
  <rect width="800" height="420" rx="16" stroke="#4a2818" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Ambient Glow -->
  <circle cx="680" cy="110" r="160" fill="#f59e0b" fill-opacity="0.12" filter="url(#glow-4)" />
  <circle cx="160" cy="300" r="140" fill="#f43f5e" fill-opacity="0.08" filter="url(#glow-4)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 70 H800 M0 140 H800 M0 210 H800 M0 280 H800 M0 350 H800" />
    <path d="M100 0 V420 M200 0 V420 M300 0 V420 M400 0 V420 M500 0 V420 M600 0 V420 M700 0 V420" />
  </g>

  <!-- Mobile & Media Pipeline Showcase Container -->
  <g transform="translate(60, 45)">
    <rect width="680" height="330" rx="12" fill="#17100b" stroke="#3d2114" stroke-width="1.5" />
    
    <!-- Top Header -->
    <rect width="680" height="42" rx="12" fill="#24150d" />
    <rect y="30" width="680" height="12" fill="#24150d" />
    
    <circle cx="28" cy="21" r="7" fill="#f59e0b" />
    <text x="44" y="25" fill="#f1f5f9" font-family="sans-serif" font-weight="600" font-size="13">360 Smile App // Flutter Multiplatform &amp; Media Pipeline</text>

    <rect x="490" y="10" width="175" height="22" rx="6" fill="#140f0c" stroke="#f59e0b" stroke-width="1" />
    <circle cx="504" cy="21" r="3.5" fill="#f59e0b" />
    <text x="514" y="25" fill="#fbbf24" font-family="monospace" font-weight="600" font-size="10">GOOGLE PLAY IN PROD</text>

    <!-- Smartphone Mockup on Left -->
    <g transform="translate(45, 55)">
      <!-- Phone Frame -->
      <rect width="140" height="255" rx="18" fill="#0c0806" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.6" />
      <!-- Notch / Camera pill -->
      <rect x="45" y="8" width="50" height="8" rx="4" fill="#24150d" />
      
      <!-- Video Viewport -->
      <rect x="10" y="24" width="120" height="160" rx="8" fill="#24140b" />
      
      <!-- 360 Rotatory indicator ring -->
      <circle cx="70" cy="100" r="38" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" fill="none" />
      <circle cx="70" cy="100" r="16" fill="#f59e0b" fill-opacity="0.2" />
      <text x="58" y="105" fill="#fbbf24" font-family="monospace" font-weight="bold" font-size="13">360°</text>

      <!-- Record Controls inside phone -->
      <rect x="20" y="195" width="100" height="24" rx="12" fill="#f43f5e" />
      <text x="36" y="211" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">RENDER CLIP</text>

      <text x="24" y="238" fill="#a8a29e" font-family="monospace" font-size="8">AUDIO + FX ENCODED</text>
    </g>

    <!-- Media Pipeline Flow on Right -->
    <g transform="translate(220, 60)">
      <rect width="420" height="245" rx="8" fill="#0d0806" stroke="#2b170e" />
      
      <text x="20" y="30" fill="#fbbf24" font-family="monospace" font-weight="600" font-size="11">VIDEO ENCODING &amp; CLOUD STORAGE PIPELINE</text>

      <!-- Step 1: Camera capture -->
      <g transform="translate(20, 48)">
        <rect width="380" height="42" rx="6" fill="#1a0f08" stroke="#3d2114" />
        <circle cx="20" cy="21" r="5" fill="#f59e0b" />
        <text x="36" y="19" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="500">Live 360° Camera Capture</text>
        <text x="36" y="33" fill="#78716c" font-family="monospace" font-size="9">Dynamic FPS · Slow-Motion &amp; Reverse</text>
        <text x="310" y="25" fill="#34d399" font-family="monospace" font-size="10">RAW 4K</text>
      </g>

      <!-- Step 2: Overlay Engine -->
      <g transform="translate(20, 100)">
        <rect width="380" height="42" rx="6" fill="#1a0f08" stroke="#3d2114" />
        <circle cx="20" cy="21" r="5" fill="#f43f5e" />
        <text x="36" y="19" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="500">Audio Overlay &amp; Branding Filters</text>
        <text x="36" y="33" fill="#78716c" font-family="monospace" font-size="9">Soundtrack Sync &amp; Color Grading</text>
        <text x="310" y="25" fill="#f43f5e" font-family="monospace" font-size="10">ENCODED</text>
      </g>

      <!-- Step 3: Cloud Distro -->
      <g transform="translate(20, 152)">
        <rect width="380" height="42" rx="6" fill="#1a0f08" stroke="#3d2114" />
        <circle cx="20" cy="21" r="5" fill="#10b981" />
        <text x="36" y="19" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="500">Instant QR Delivery &amp; Cloud Storage</text>
        <text x="36" y="33" fill="#78716c" font-family="monospace" font-size="9">Google Play Distribution Pipeline</text>
        <text x="310" y="25" fill="#10b981" font-family="monospace" font-size="10">COMPLETED</text>
      </g>

      <text x="20" y="222" fill="#a8a29e" font-family="monospace" font-size="10">Architecture: Flutter + Native Channels + Video Processing Engine</text>
    </g>
  </g>
</svg>
